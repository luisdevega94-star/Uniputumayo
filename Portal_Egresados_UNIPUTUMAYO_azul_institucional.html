<style>
:root{--bg:#f5f8fa;--surf:#fff;--tx:#1a232b;--mut:#4a5a66;--pri:#1a6891;--pri-tx:#fff;--acc:#86bc25;--bd:#cfd9e0;--err:#a4161a;--ok:#0b6b3a;--focus:#0a4ea3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0e1720;--surf:#16212b;--tx:#eef3f7;--mut:#b2c1cd;--pri:#6db9e6;--pri-tx:#04202f;--bd:#33434f;--err:#ff8c90;--ok:#7be0a8;--focus:#8ab8ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}

header{background:var(--pri);color:var(--pri-tx);position:sticky;top:0;z-index:10}
.top{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.btn{font:inherit;border-radius:8px;border:2px solid var(--pri);background:var(--pri);color:var(--pri-tx);padding:9px 16px;cursor:pointer;min-height:44px}
.btn.sec{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn.hd{background:transparent;color:var(--pri-tx);border-color:rgba(255,255,255,.6);min-height:40px;padding:6px 12px}

nav{background:var(--surf);border-bottom:1px solid var(--bd)}
nav ul{max-width:1100px;margin:0 auto;padding:0 8px;list-style:none;display:flex;gap:2px;overflow-x:auto}
nav a{display:block;padding:12px 14px;text-decoration:none;color:var(--mut);border-bottom:4px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--tx);font-weight:700;border-color:var(--pri)}
nav a:hover{color:var(--tx)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 90px}

.quick a{text-decoration:none;display:block}

.ico{font-size:1.6rem;display:block}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:8px;border:2px solid var(--bd);background:var(--surf);color:var(--tx);min-height:44px}
input[aria-invalid="true"]{border-color:var(--err)}
.hint{font-size:.88rem;color:var(--mut)}.err{color:var(--err);font-size:.9rem;min-height:1.2em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:160px}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 14px;flex-wrap:wrap}
.steps li{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);font-size:.9rem}
.steps li.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:700}
.steps li.done{border-color:var(--ok);color:var(--ok)}
progress{width:100%;height:12px;accent-color:var(--pri)}
table{width:100%;border-collapse:collapse;background:var(--surf);font-size:.95rem}
th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:10px;display:none;gap:14px;align-items:center;z-index:30;max-width:92vw}
#toast button{background:none;border:0;color:var(--acc);font:inherit;text-decoration:underline;cursor:pointer;min-height:36px}
#help{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25}
#helpbox{display:none;position:absolute;right:0;bottom:56px;width:min(320px,88vw);background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
footer{border-top:1px solid var(--bd);padding:18px 16px;text-align:center;color:var(--mut);font-size:.88rem}
footer a{margin:0 6px}
footer .pie a{margin:0;display:inline-block;padding:5px 0}
.chips button{margin:0 6px 6px 0}
.topbar{background:var(--surf);border-bottom:1px solid var(--bd);font-size:.85rem}
.topin{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.topin div{display:flex;gap:2px 8px;flex-wrap:wrap;align-items:center}
.topin a,.topin button{color:var(--mut);background:none;border:0;font:inherit;cursor:pointer;padding:8px 6px;min-height:40px;text-decoration:none}
.topin a:hover,.topin button:hover{color:var(--tx);text-decoration:underline}
.topin [aria-current]{color:var(--tx);font-weight:700}
#share .grid{margin:12px 0}

.acts{display:flex;gap:8px;flex-wrap:wrap}
.svc-layout{display:grid;gap:18px;grid-template-columns:1fr 260px;align-items:start}
@media(max-width:800px){.svc-layout{grid-template-columns:1fr}}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tiles.list{grid-template-columns:1fr}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;padding:16px 10px}
.tile:hover{border-color:var(--pri)}
.tiles.list .tile{flex-direction:row;text-align:left;padding:10px 14px}
.tile .ic{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);font-size:1.7rem}
.aside a{display:block;border-left:3px solid var(--acc);padding:8px 12px;margin:8px 0}
:root{--r:16px;--shadow:0 1px 2px rgba(14,40,60,.06),0 8px 24px rgba(14,40,60,.08);--g1:#124d73;--g2:#2384b8}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:clamp(1.6rem,3vw,2.1rem);letter-spacing:-.02em;font-weight:800}
main>section>h2{display:flex;align-items:center;gap:10px;font-weight:700;margin-top:1.8em}

.card{border-radius:var(--r);box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s}
a>.card:hover,a.card:hover,.card.lift:hover{transform:translateY(-3px);border-color:var(--pri)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.card:hover{transform:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:12px}
.topin button{display:inline-flex;align-items:center;gap:6px}
nav a{display:flex;align-items:center;gap:8px}
nav a[aria-current="page"]{background:color-mix(in srgb,var(--pri) 10%,transparent);border-radius:10px 10px 0 0}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#2f9fd0);color:#fff;border-radius:22px;padding:30px 26px;display:grid;gap:22px;grid-template-columns:1.5fr 1fr;align-items:center}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(134,188,37,.28);pointer-events:none}
.hero::before{width:260px;height:260px;right:-70px;top:-100px}
.hero::after{width:170px;height:170px;left:44%;bottom:-90px;background:rgba(255,255,255,.09)}
.hero>*{position:relative;z-index:1}
.hero .btn.hd{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
.hero input{border-radius:12px;border:0}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.pcard{background:rgba(255,255,255,.97);color:#1b2420;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.bar{height:10px;border-radius:6px;background:#dfe7ee;overflow:hidden;margin-top:12px}

.ic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:15px;color:#fff;flex:0 0 auto;box-shadow:0 4px 10px rgba(0,0,0,.16)}
.qc{display:flex;gap:14px;align-items:center;height:100%}
.qc h3{margin:0 0 2px}.qc p{margin:0}.qc .go{margin-left:auto;color:var(--mut);flex:0 0 auto}
.stat{display:flex;gap:12px;align-items:center}
.tile .ic{width:62px;height:62px;border:0;border-radius:17px}
.tiles.list .tile .ic{width:48px;height:48px}
.av{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:0 0 auto}
.nb{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:62px;border-radius:14px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;line-height:1.05;flex:0 0 auto}
.date b{font-size:1.5rem;font-weight:800}.date small{font-size:.68rem;font-weight:700;letter-spacing:.07em}
.tag{display:inline-flex;align-items:center;gap:4px}
#toast svg{color:var(--acc)}
footer{background:#0c2a3d;color:#cfe0ec;border:0;margin-top:30px;padding:28px 16px}
footer a{color:#eaf3f9}
footer .btn.sec{color:#fff;border-color:rgba(255,255,255,.35)}
footer .hint{color:#b8cfdf}
.hero{grid-template-columns:1fr 1fr;gap:30px}
.vis{position:relative;margin:0 0 14px}
.vis::before{content:"";position:absolute;left:-14px;bottom:-14px;width:68%;height:62%;border-radius:28px;background:var(--acc);z-index:0}
.vis .ph{position:relative;z-index:1;display:block;width:100%;height:auto;border-radius:26px 26px 84px 26px;border:4px solid rgba(255,255,255,.92);box-shadow:0 14px 34px rgba(0,0,0,.28);background:#1a6891}
.vis .chip{position:absolute;z-index:2;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.96);color:#0d3a55;border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.bar{background:var(--bd)}
.pstrip{display:grid;grid-template-columns:1.4fr 1fr auto;gap:18px;align-items:center;margin-top:18px}
.pstrip .bar{margin:0}
@media(max-width:820px){.hero{grid-template-columns:1fr}.pstrip{grid-template-columns:1fr}}

.app{min-height:100vh}
.ib{width:44px;padding:0!important}
.mob h1{font-size:1.45rem}
.mob main{padding:14px 14px 150px}
.mob .hero{grid-template-columns:1fr;padding:16px;gap:16px;border-radius:20px}
.mob .vis::before{left:-8px;bottom:-8px}
.mob .hero form{max-width:none!important}
.mob .chips{display:flex;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}
.mob .chips button{flex:0 0 auto;white-space:nowrap}
.mob .grid{grid-template-columns:1fr}
.mob .quick{grid-template-columns:1fr 1fr!important}
.mob .qc{flex-direction:column;align-items:flex-start;gap:8px}
.mob .qc .go{display:none}
.mob .qc h3{font-size:.98rem}
.mob .tiles{grid-template-columns:1fr 1fr}
.mob .tiles.list{grid-template-columns:1fr}
.mob .svc-layout,.mob .pstrip{grid-template-columns:1fr}
.mob .row>*{min-width:100%}
.mob .acts .btn{flex:1}
.mob .stat{flex-direction:column;align-items:flex-start}
.mob footer .pie{display:none}
.mob footer{padding:20px 14px 150px}
.mob #help{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.mob #cookies{left:10px!important;right:10px!important;max-width:none!important;bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
.mob #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.mob #share{align-items:flex-end!important;padding:0!important}
.mob #share>.card{width:100%!important;border-radius:20px 20px 0 0}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--bd);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:35}
nav.tabbar a,nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:6px 2px;border:0;border-top:3px solid transparent;border-radius:0;background:none;color:var(--mut);font:inherit;font-size:.72rem;font-weight:600;text-decoration:none;cursor:pointer}
nav.tabbar a[aria-current="page"],nav.tabbar button.on{color:var(--pri);border-top-color:var(--pri);background:none}
.sheetbg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:85%;overflow:auto;background:var(--surf);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheetlist a{display:flex;align-items:center;gap:14px;padding:10px 4px;text-decoration:none;border-bottom:1px solid var(--bd);font-weight:600;min-height:56px}
.sheetlist a .go{margin-left:auto;color:var(--mut)}
.sheetlist .ic{width:40px;height:40px;border-radius:12px}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;background:radial-gradient(circle at 20% 10%,#1e5a80,#0b2233 70%);color:#fff}
.phone{position:relative;width:390px;max-width:100%;height:min(820px,calc(100vh - 90px));border-radius:44px;border:11px solid #0c0f0e;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 2px #2a2f2d;overflow:hidden;background:var(--bg);transform:translate3d(0,0,0)}
.phone::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:96px;height:20px;background:#0c0f0e;border-radius:99px;z-index:60}
.screen{height:100%;overflow-y:auto;overflow-x:hidden}
.phone header .top{padding-top:30px}
.phone .app{min-height:100%}

.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.hero>*{min-width:0}
.vis .ph{max-width:100%}
.mob .hero{grid-template-columns:minmax(0,1fr)}
.mob .grid{grid-template-columns:minmax(0,1fr)}
.mob .quick{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.mob .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.mob .tiles.list{grid-template-columns:minmax(0,1fr)}
.mob .svc-layout,.mob .pstrip{grid-template-columns:minmax(0,1fr)}
.mob #cookies .btn{padding:8px 12px;min-height:40px}

.mob .row>.half{min-width:calc(50% - 5px)}
.mob .hero form .btn{width:100%}
.mob .steps li{font-size:.8rem;padding:5px 10px}
.mob label{margin-top:10px}
.mob #cookies .btn{padding:6px 10px;font-size:.85rem}
.mob #cookies p{font-size:.85rem!important}
/* ===== Barra lateral y menú lateral ===== */
.lay{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
.lay-main{min-width:0}
.side{position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}
.side .sh{font-size:1.05rem;margin:0 0 8px}
.aside{position:sticky;top:96px}
@media(max-width:1000px){.lay{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.mob .aside{position:static}
.mob header .top{padding:10px 12px;gap:8px}
.mob .logo{font-size:1rem}
.drawerbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(310px,86%);background:var(--surf);padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:8px 0 30px rgba(0,0,0,.3);animation:dslide .22s ease-out}
@keyframes dslide{from{transform:translateX(-100%)}to{transform:none}}

.drawer .sheetlist a[aria-current="page"]{color:var(--pri);font-weight:800}

.mob .acts .btn.ib{flex:0 0 44px}

 ::-webkit-scrollbar{width:14px;height:14px}

 ::-webkit-scrollbar-thumb:hover{filter:brightness(1.15)}
 @supports not selector(::-webkit-scrollbar){html,*{scrollbar-color:var(--pri) var(--bd);scrollbar-width:auto}}
}

.app:not(.mob) .rail{top:72px;bottom:16px}

<noscript>Este mockup necesita JavaScript para funcionar.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
const {useState,useEffect,useRef,useMemo,createContext,useContext}=React;
const html=htm.bind(React.createElement);
const Ctx=createContext(null);
const use=()=>useContext(Ctx);
const go=v=>{location.hash=v};

/* ---------- Iconos propios (SVG) ---------- */
const P={
home:`<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>`,
phone:`<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>`,
more:`<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>`,
close:`<path d="M6 6l12 12M18 6L6 18"/>`,

const HEUR="\n <h1 id=\"t-heuristicas\">Criterios heurísticos aplicados<\/h1>\n <p class=\"hint\">Trazabilidad entre las 10 heurísticas de Nielsen, WCAG 2.1 AA y este mockup, construido como una app de React sin backend.<\/p>\n <div class=\"scroll\"><table><thead><tr><th>Criterio<\/th><th>Dónde se aplica en el mockup<\/th><\/tr><\/thead><tbody>\n <tr><td>1. Visibilidad del estado<\/td><td>Migas de pan, menú con página activa, pasos y barra de progreso, contador de resultados.<\/td><\/tr>\n <tr><td>2. Coincidencia con el mundo real<\/td><td>Lenguaje claro en español, iconos con texto, “egresado” y trámites con nombres cotidianos.<\/td><\/tr>\n <tr><td>3. Control y libertad<\/td><td>Cancelar formulario, deshacer inscripción, limpiar filtros, botón Atrás.<\/td><\/tr>\n <tr><td>4. Consistencia y estándares<\/td><td>Mismos botones, tarjetas y colores en todas las secciones; menú fijo.<\/td><\/tr>\n <tr><td>5. Prevención de errores<\/td><td>Tipos de campo, ejemplos (placeholder), confirmación previa y autorización explícita.<\/td><\/tr>\n <tr><td>6. Reconocer antes que recordar<\/td><td>Sugerencias de búsqueda, opciones visibles, resumen antes de enviar.<\/td><\/tr>\n <tr><td>7. Flexibilidad y eficiencia<\/td><td>Atajo “/” para buscar, filtros combinables, alertas, enlaces rápidos.<\/td><\/tr>\n <tr><td>8. Diseño minimalista<\/td><td>Una acción principal por pantalla; formulario dividido en 3 pasos.<\/td><\/tr>\n <tr><td>9. Recuperación de errores<\/td><td>Mensajes junto al campo que dicen qué pasó y cómo corregirlo.<\/td><\/tr>\n <tr><td>10. Ayuda y documentación<\/td><td>Botón de ayuda siempre visible, textos de apoyo en cada formulario.<\/td><\/tr>\n <tr><td>WCAG 2.1 AA<\/td><td>Contraste ≥ 4,5:1, enlace “Saltar al contenido”, foco visible, etiquetas, objetivos táctiles de al menos 40 px, modo oscuro, diseño responsive.<\/td><\/tr>\n <\/tbody><\/table><\/div>\n <h2>Elementos tomados de los referentes<\/h2>\n <div class=\"scroll\"><table><thead><tr><th>Elemento<\/th><th>Referente<\/th><th>Mejora aplicada<\/th><\/tr><\/thead><tbody>\n <tr><td>Buscador protagonista «¿Qué estás buscando?»<\/td><td>Casa Club UdeMedellín<\/td><td>Se añadieron búsquedas frecuentes, sugerencias y el atajo «/».<\/td><\/tr>\n <tr><td>Accesos rápidos grandes<\/td><td>Casa Club UdeMedellín<\/td><td>Cada tarjeta muestra un dato útil (ofertas nuevas, próximo evento).<\/td><\/tr>\n <tr><td>Formulario «¿Te asesoramos?»<\/td><td>Casa Club UdeMedellín<\/td><td>Validación junto a cada campo y consentimiento explícito y corto.<\/td><\/tr>\n <tr><td>Pie de página por públicos<\/td><td>Casa Club UdeMedellín<\/td><td>Cuatro columnas en lugar de decenas de enlaces repetidos.<\/td><\/tr>\n <tr><td>Horarios y contacto<\/td><td>Casa Club UdeMedellín<\/td><td>Indicador «Abierto ahora» y horarios completos plegables.<\/td><\/tr>\n <tr><td>Aviso de cookies<\/td><td>Casa Club UdeMedellín<\/td><td>Texto breve con Aceptar y Configurar.<\/td><\/tr>\n <tr><td>Selector de audiencia (Egresado, Empleador, Estudiante)<\/td><td>Imperial y Stanford<\/td><td>Barra superior con la audiencia actual marcada.<\/td><\/tr>\n <tr><td>Selector «Encuentra un programa» en el inicio<\/td><td>Imperial<\/td><td>Nivel y modalidad llevan directo al catálogo ya filtrado.<\/td><\/tr>\n <tr><td>Novedades con categoría, tiempo de lectura y fecha<\/td><td>Stanford<\/td><td>Cada nota lleva a la sección correspondiente del portal.<\/td><\/tr>\n <tr><td>Cifras de la comunidad<\/td><td>Imperial, Stanford y MIT<\/td><td>Datos de ejemplo, claramente marcados.<\/td><\/tr>\n <tr><td>Comunidad de egresados en LinkedIn después del programa<\/td><td>MIT Professional Education<\/td><td>Tarjeta para unirse al grupo y seguir en contacto.<\/td><\/tr>\n <tr><td>Redes (X, TikTok, Instagram, Facebook): seguir, ver publicaciones y compartir<\/td><td>Imperial y Stanford<\/td><td>Filtro por red y diálogo de compartir con foco controlado.<\/td><\/tr>\n <tr><td>Catálogo de servicios con buscador, vista en cuadrícula o lista y enl /* ---------- Utilidades ---------- */
const vNom=v=>v.trim().length<5?"Escribe tu nombre y apellido completos.":"";
const vMail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim())?"":"El correo no parece válido. Ejemplo: nombre@correo.com";
const vTel=v=>/^3\d{9}$/.test(v.replace(/\s/g,""))?"":"El celular debe tener 10 dígitos y empezar por 3.";
const hayError=o=>Object.values(o).some(Boolean);
function abierto(){const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Bogota"}));const w=d.getDay(),h=d.getHours()+d.getMinutes()/60;return w>=1&&w<=5&&((h>=8&&h<12)||(h>=14&&h<18))}
function useHash(){const g=()=>{const v=(location.hash||"#inicio").slice(1);return TITLES[v]?v:"inicio"};const[v,s]=useState(g);useEffect(()=>{const f=()=>s(g());addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);return v}

/* ---------- Componentes base ---------- */
const Tag=({children,ok})=>html`<span className="tag" style=${ok?{color:"var(--ok)",borderColor:"var(--ok)"}:null}>${children}</span>`;
const Mock=({m,children})=>{const{aviso}=use();return html`<a href="#inicio" onClick=${e=>{e.preventDefault();aviso("Mockup: "+m)}}>${children}</a>`};
function Input({id,label,err,hint,...p}){return html`<div><label htmlFor=${id}>${label}</label><input id=${id} aria-invalid=${err?"true":"false"} aria-describedby=${id+"-e"} ...${p}/>${hint&&html`<span className="hint">${hint}</span>`}<p className="err" id=${id+"-e"} role="alert">${err||""}</p></div>`}

function TopBar(){const{seguir,toggleVm}=use();
 return html`<div className="topbar"><div className="topin">
  <div role="group" aria-label="Soy"><span>Soy:</span><a href="#inicio" aria-current="true">Egresado</a><${Mock} m="vista para empleadores.">Empleador<//><${Mock} m="vista para estudiantes y aspirantes.">Estudiante o aspirante<//></div>
  <div role="group" aria-label="Redes sociales"><button type="button" onClick=${toggleVm}><${Ic} n="phone" s=${15}/> Vista de celular</button><span>Síguenos:</span>${["X","TikTok","Instagram","Facebook"].map(n=>html`<button key=${n} type="button" aria-label=${"Seguir en "+n} onClick=${()=>seguir(n)}><${Ic} n=${n} s=${16}/> ${n}</button>`)}</div></div></div>`}

function Header(){const{dark,toggleTheme,search}=use();const ref=useRef();const[q,setQ]=useState("");
 useEffect(()=>{const f=e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();ref.current.focus()}};addEventListener("keydown",f);return()=>removeEventListener("keydown",f)},[]);
 return html`<header><div className="top">

function Educacion(){const{pf,setPf,aviso}=use();
 const[l,setL]=useState({n:"",t:"",m:"",i:"",h:false}),[er,setEr]=useState({});
 useEffect(()=>{const b=document.querySelector("#lead [aria-invalid='true']");if(b)b.focus()},[er]);
 const list=PROGS.filter(p=>(!pf.n||p.n===pf.n)&&(!pf.m||p.m===pf.m));
 const set=k=>e=>setL({...l,[k]:e.target.value});
 const pedir=p=>{setL({...l,i:p.t});document.getElementById("lead").scrollIntoView({behavior:"smooth"});document.getElementById("ln").focus()};
 const send=e=>{e.preventDefault();const x={n:vNom(l.n),t:vTel(l.t),m:vMail(l.m),h:l.h?"":"Necesitamos tu autorización para contactarte."};setEr(x);if(hayError(x))return;setL({n:"",t:"",m:"",i:"",h:false});aviso("Solicitud enviada. Te contactaremos en un día hábil.")};
 return html`<section aria-labelledby="t-educacion"><h1 id="t-educacion">Educación continua</h1>
  <form className="card" onSubmit=${e=>e.preventDefault()} aria-label="Filtros de programas"><div className="row">
   <div className="half"><label htmlFor="pn">Nivel</label><select id="pn" value=${pf.n} onChange=${e=>setPf({...pf,n:e.target.value})}><option value="">Todos</option><option>Curso</option><option>Diplomado</option><option>Posgrado</option></select></div>
   <div className="half"><label htmlFor="pm">Modalidad</label><select id="pm" value=${pf.m} onChange=${e=>setPf({...pf,m:e.target.value})}><option value="">Todas</option><option>Virtual</option><option>Híbrido</option><option>Presencial</option></select></div>
   <div style=${{flex:"0 0 auto"}}><button className="btn sec" type="button" onClick=${()=>setPf({n:"",m:""})}>Limpiar filtros</button></div></div></form>
  <p role="status" aria-live="polite">${list.length?list.length+" programas encontrados":"No hay programas con esos filtros. Pulsa «Limpiar filtros» para ver todos."}</p>
  <div className="grid">${list.map(p=>html`<article key=${p.t} className="card"><h3>${p.t}</h3><p><${Tag}>${p.n}<//><${Tag}>${p.m}<//><${Tag}>${p.h}<//></p><p className="hint">${p.d}</p><button className="btn" onClick=${()=>pedir(p)}>Pedir información</button></article>`)}</div>
  <h2>¿Te asesoramos?</h2>
  <form className="card" id="lead" noValidate onSubmit=${send}><p className="hint" style=${{marginTop:0}}>Déjanos tus datos y te contactamos en un día hábil.</p>
   <${Input} id="ln" label="Nombre completo" autoComplete="name" value=${l.n} onChange=${set("n")} err=${er.n}/>
   <div className="row"><${Input} id="lt" label="Celular" inputMode="numeric" placeholder="3001234567" autoComplete="tel" value=${l.t} onChange=${set("t")} err=${er.t}/><${Input} id="lm" label="Correo electrónico" type="email" placeholder="nombre@correo.com" autoComplete="email" value=${l.m} onChange=${set("m")} err=${er.m}/></div>
   <${Input} id="li" label="Programa de interés (opcional)" value=${l.i} onChange=${set("i")}/>
   <label style=${{fontWeight:400}}><input type="checkbox" checked=${l.h} aria-invalid=${er.h?"true":"false"} onChange=${e=>setL({...l,h:e.target.checked})} style=${{width:"auto",minHeight:"auto"}}/> Autorizo el tratamiento de mis datos para esta consulta (Ley 1581 de 2012).</label><p className="err" role="alert">${er.h||""}</p>
   <button className="btn">Enviar solicitud</button></form></section>`}

function Datos(){const{aviso}=use();
 const[st,setSt]=useState(1),[f,setF]=useState({nom:"",mail:"",tel:"",est:"Empleado",emp:"",car:"",ok:false}),[er,setEr]=useState({}),[done,setDone]=useState(false),[leave,setLeave]=useState(false);
 useEffect(()=>{const b=document.querySelector("#f [aria-invalid='true']");if(b)b.focus()},[er]);
 const set=k=>e=>setF({...f,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value});
 const next=()=>{if(st===1){const x={nom:vNom(f.nom),mail:vMail(f.mail),tel:vTel(f.tel)};setEr(x);if(hayError(x))return}
  if(st===3){if(!f.ok){setEr({ok:"Para guardar tus datos necesitamos tu autorización."});return}setDone(true);return}
  setEr({});setSt(st+1)};
 if(done)return html`<section aria-labelledby="t-datos"><h1 id="t-datos">Actualizar mis datos</h1><div className="card" role="status"><h2 style=${{marginTop:0}}>¡Datos actualizados!</h2><p>Guardamos tus cambios. Puedes editarlos cuando quieras.</p><button className="btn" onClick=${()=>go("inicio")}>Volver al inicio</button></div></section>`;
 const steps=["1. Contacto","2. Situación laboral","3. Confirmar"];
 const res=[["Nombre",f.nom],["Correo",f.mail],["Celular",f.tel],["Situación",f.est],["Empresa",f.emp||"—"],["Cargo",f.car||"—"]];
 return html`<section aria-labelledby="t-datos"><h1 id="t-datos">Actualizar mis datos</h1>
  <ol className="steps" aria-label="Progreso">${steps.map((s,i)=>html`<li key=${s} className=${i+1===st?"on":i+1<st?"done":""} aria-current=${i+1===st?"step":null}>${s}</li>`)}</ol>
  <progress max=${3} value=${st} aria-label="Progreso del formulario"></progress>
  <form className="card" id="f" noValidate onSubmit=${e=>e.preventDefault()}>
   ${st===1&&html`<div><${Input} id="nom" label="Nombre completo" autoComplete="name" value=${f.nom} onChange=${set("nom")} err=${er.nom}/><${Input} id="mail" label="Correo electrónico" type="email" autoComplete="email" placeholder="nombre@correo.com" hint="Lo usaremos solo para avisos del portal." value=${f.mail} onChange=${set("mail")} err=${er.mail}/><${Input} id="tel" label="Celular" inputMode="numeric" autoComplete="tel" placeholder="3001234567" value=${f.tel} onChange=${set("tel")} err=${er.tel}/></div>`}
   ${st===2&&html`<div><label htmlFor="est">Situación actual</label><select id="est" value=${f.est} onChange=${set("est")}>${["Empleado","Independiente","Buscando empleo","Estudiando"].map(o=>html`<option key=${o}>${o}</option>`)}</select><${Input} id="emp" label="Empresa o entidad (opcional)" value=${f.emp} onChange=${set("emp")}/><${Input} id="car" label="Cargo (opcional)" value=${f.car} onChange=${set("car")}/></div>`}
   ${st===3&&html`<div><h2 style=${{marginTop:0}}>Revisa tus datos</h2><dl style=${{margin:0}}>${res.map(([k,v])=>html`<div key=${k}><dt><strong>${k}</strong></dt><dd style=${{margin:"0 0 8px"}}>${v}</dd></div>`)}</dl>
    <label style=${{fontWeight:400}}><input type="checkbox" checked=${f.ok} aria-invalid=${er.ok?"true":"false"} onChange=${set("ok")} style=${{width:"auto",minHeight:"auto"}}/> Autorizo el tratamiento de mis datos (Ley 1581 de 2012).</label><p className="err" role="alert">${er.ok||""}</p></div>`}
   <div className="acts" style=${{marginTop:14}}>${st>1&&html`<button className="btn sec" type="button" onClick=${()=>{setEr({});setSt(st-1)}}>Atrás</button>`}<button className="btn" type="button" onClick=${next}>${st===3?"Guardar datos":"Siguiente"}</button><button className="btn sec" type="button" onClick=${()=>setLeave(true)}>Cancelar</button></div>
   ${leave&&html`<div className="card" role="alertdialog" aria-label="Confirmar salida" style=${{marginTop:12}}><p style=${{marginTop:0}}>¿Salir sin guardar? Perderás lo que escribiste.</p><div className="acts"><button type="button" className="btn" onClick=${()=>go("inicio")}>Salir</button><button type="button" className="btn sec" onClick=${()=>setLeave(false)}>Seguir editando</button></div></div>`}
  </form></section>`}

/* ---------- Barra de desplazamiento visible ---------- */
function Scroller({scr,rail}){const[s,setS]=useState({show:false,h:0,t:0,y:0,ov:false});const r=useRef();
 const el=()=>scr.current||document.scrollingElement||document.documentElement;
 useEffect(()=>{const e=el(),tgt=scr.current||window;
  const upd=()=>{const ch=e.clientHeight,sh=e.scrollHeight,sc=e.scrollTop,tr=r.current?r.current.clientHeight:ch-132;
   const ov=(scr.current?e.offsetWidth-e.clientWidth:innerWidth-document.documentElement.clientWidth)<4;
   if(sh<=ch+8){setS({show:false,h:0,t:0,y:sc,ov});return}
   const th=Math.max(40,tr*ch/sh);setS({show:true,h:th,t:(tr-th)*sc/(sh-ch),y:sc,ov})};
  upd();tgt.addEventListener("scroll",upd,{passive:true});addEventListener("resize",upd);
  const ro=new ResizeObserver(upd);ro.observe(e===document.documentElement?document.body:(e.firstElementChild||e));
  return()=>{tgt.removeEventListener("scroll",upd);removeEventListener("resize",upd);ro.disconnect()}},[]);
 const move=ev=>{const b=r.current.getBoundingClientRect(),e=el();const y=Math.min(Math.max(ev.clientY-b.top-s.h/2,0),b.height-s.h);e.scrollTop=y/(b.height-s.h)*(e.scrollHeight-e.clientHeight)};
 const top=()=>{const e=el();if(e.scrollTo)e.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});else e.scrollTop=0};
 return html`<div>${(rail||s.ov)&&s.show&&html`<div className="rail" ref=${r} aria-hidden="true" onPointerDown=${ev=>{ev.currentTarget.setPointerCapture(ev.pointerId);move(ev)}} onPointerMove=${ev=>{if(ev.currentTarget.hasPointerCapture(ev.pointerId))move(ev)}}><i style=${{height:s.h,top:s.t}}></i></div>`}
  ${s.y>500&&html`<button type="button" className="totop btn" aria-label="Volver arriba" onClick=${top}><${Ic} n="up" s=${20}/></button>`}</div>`}
